# Nginx sebagai pintu masuk website.
#
# Berkas statis dilayani langsung dari dalam wadah web. Semua permintaan berkas
# .php diteruskan ke layanan app lewat jaringan bersama, sehingga kode aplikasi
# tidak perlu ikut ke dalam wadah ini.

server {
    # Hanya IPv4 yang didengar. Baris "listen [::]:80;" sengaja TIDAK ditulis.
    # Pada mesin yang IPv6-nya dimatikan, nginx berhenti seketika dengan
    # "socket() [::]:80 failed (97: Address family not supported by protocol)"
    # sehingga wadah web berulang kali dinyalakan ulang dengan kode 1. Citra
    # nginx resmi pun menghindarinya: skrip
    # /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh hanya menambahkan
    # baris itu bila /proc/net/if_inet6 ada. Skrip tersebut bekerja pada
    # default.conf bawaan citra sedangkan berkas ini menimpanya, jadi
    # perlindungan itu tidak berlaku di sini.
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Catatan nginx diarahkan ke keluaran wadah supaya terbaca lewat
    # "docker compose logs web".
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Bawaan nginx hanya 1 MB. Pendaftaran wajah mengirim sampai tiga foto
    # sekaligus, jadi batas ini dinaikkan. Nilainya sengaja dibuat lebih besar
    # daripada post_max_size di php.ini supaya permintaan yang kebesaran
    # ditolak oleh aplikasi dengan pesan yang bisa dibaca pengguna.
    client_max_body_size 32m;

    # Satu foto wajah butuh 12 sampai 15 detik untuk dihitung pada komputer
    # tanpa kartu grafis. Batas tunggu bawaan 60 detik memutus permintaan di
    # tengah jalan, jadi dinaikkan jauh di atas kebutuhan satu kiriman penuh.
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout    600s;
    fastcgi_read_timeout    600s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # app adalah nama layanan php-fpm di docker-compose.yml.
        #
        # Alamatnya sengaja dicari saat permintaan datang, bukan saat nginx
        # dinyalakan. Tanpa cara ini nginx menyelesaikan nama "app" sekali saja
        # di awal lalu menyimpan hasilnya: bila layanan app belum bisa
        # dihubungi, nginx berhenti dengan "host not found in upstream" dan
        # wadahnya berulang kali dinyalakan ulang; bila layanan app dibuat ulang
        # sehingga alamatnya berubah, nginx tetap menuju alamat lama dan
        # menjawab 502. 127.0.0.11 adalah peladen nama bawaan Docker pada
        # jaringan buatan sendiri, yaitu absen-jaringan.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;

        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        # --- TAMBAHKAN BARIS INI UNTUK MENGATASI ERROR 419 ---
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
    }

    # Nama berkas hasil build Vite sudah mengandung kode acak, jadi aman
    # disimpan lama di peramban.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Berkas tersembunyi tidak boleh dilayani, kecuali jalur verifikasi milik
    # Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;
}
