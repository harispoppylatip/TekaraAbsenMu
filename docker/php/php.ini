; Pengaturan PHP untuk wadah aplikasi presensi.
;
; Nilai bawaan PHP pada citra resmi terlalu kecil untuk dua hal di aplikasi
; ini: mengirim beberapa foto wajah sekaligus, dan menunggu perhitungan wajah
; yang butuh belasan detik per foto.

memory_limit = 512M

; Satu kali kirim pendaftaran wajah memuat paling banyak 3 foto, dan tiap foto
; dibatasi 5 MB oleh aturan validasi di aplikasi. Batas PHP dinaikkan sedikit
; di atasnya supaya permintaan yang terlalu besar ditolak oleh aplikasi dengan
; pesan yang jelas, bukan dibuang diam-diam oleh PHP.
upload_max_filesize = 8M
post_max_size = 24M

; Ini bukan pembatas utama. Pengendali unggah di aplikasi memanggil
; set_time_limit(0), jadi yang benar benar menentukan adalah
; fastcgi_read_timeout di konfigurasi nginx.
max_execution_time = 300
max_input_time = 300

expose_php = Off
date.timezone = Asia/Makassar

; Opcache: kode ikut beku di dalam citra, sedangkan penyimpanan dan basis data
; tetap hidup di luar citra.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Pemeriksaan waktu berkas dibiarkan hidup supaya hasil build ulang langsung
; terpakai tanpa langkah tambahan. Dua detik tidak terasa untuk aplikasi
; internal seperti ini.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
